<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Карта пути</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,serif;background:#f5efe0;color:#1a1a1a;overflow:hidden;height:100vh}
.screen{display:none;height:100vh;overflow:hidden}
.screen.active{display:block}
#canvas{width:100vw;height:100vh;display:block;cursor:grab;touch-action:none}
#canvas:active{cursor:grabbing}
.title-bar{position:fixed;top:14px;left:50%;transform:translateX(-50%);text-align:center;z-index:5;pointer-events:none}
.title-bar h1{font-size:18px;color:#1a3a3a;letter-spacing:5px}
.title-bar p{font-size:9px;color:#7a7a68;letter-spacing:3px;font-style:italic;margin-top:3px}
.controls{position:fixed;top:12px;left:12px;background:#fff;border-radius:10px;padding:10px 12px;box-shadow:0 4px 20px rgba(26,74,106,.12);z-index:10;width:220px;max-height:calc(100vh - 24px);overflow-y:auto;font-size:11px}
.controls button{background:#f0e8d0;border:1px solid #d8c8a0;padding:6px 9px;border-radius:6px;font-family:inherit;font-size:10.5px;color:#1a3a3a;cursor:pointer;text-align:left;width:100%;margin-bottom:4px;line-height:1.35}
.controls button:hover{background:#c9a84a;color:#fff}
.controls .course-btn{background:#1a4a6a;color:#fff;border-color:#1a4a6a;font-weight:bold;padding:8px 10px}
.controls .course-btn:hover{background:#c9a84a;border-color:#c9a84a}
.controls .course-btn.active{background:#c9a84a;border-color:#c9a84a;color:#fff}
.controls .course-btn.philosophy{background:#5a1a6a;border-color:#5a1a6a}
.controls .course-btn.philosophy:hover{background:#c9a84a;border-color:#c9a84a}
.controls .course-btn.philosophy.active{background:#c9a84a;border-color:#c9a84a;color:#fff}
.total-progress{background:#1a4a6a;color:#fff;padding:8px 11px;border-radius:8px;margin-bottom:8px}
.total-progress.philosophy{background:#5a1a6a}
.total-progress .label{font-size:8px;letter-spacing:1.5px;color:#c9a84a;margin-bottom:3px}
.total-progress .value{font-size:16px;font-weight:bold;margin-bottom:4px}
.total-progress .sub{font-size:9.5px;color:#c9d8e8;margin-bottom:5px;line-height:1.4}
.total-progress .bar{height:4px;background:rgba(255,255,255,.2);border-radius:2px;overflow:hidden;margin-top:5px}
.total-progress .bar>div{height:100%;background:#c9a84a;transition:width .4s}
.date-block{background:#f5efe0;border-radius:8px;padding:7px 9px;margin-bottom:8px}
.date-block .dl{font-size:8px;letter-spacing:1.5px;color:#8a5a1a;margin-bottom:4px}
.date-block .dv{font-size:10.5px;color:#1a4a6a;font-weight:bold;margin-bottom:5px;padding-bottom:5px;border-bottom:1px dashed #d8c8a0}
.date-block input{width:100%;padding:4px 6px;border:1px solid #d8c8a0;border-radius:5px;font-family:inherit;font-size:10px;background:#fff}
.controls .divider{height:1px;background:#e0d8c0;margin:8px 0}
.legend{position:fixed;bottom:12px;left:12px;background:#fff;border-radius:10px;padding:8px 12px;box-shadow:0 4px 20px rgba(26,74,106,.12);z-index:10;font-size:10px}
.legend-item{display:flex;align-items:center;gap:6px;margin:3px 0;color:#3a3a3a}
.legend-dot{width:10px;height:10px;border-radius:50%}
.legend-check{display:inline-flex;align-items:center;justify-content:center;width:12px;height:12px;background:#c9a84a;border-radius:50%;color:#fff;font-size:8px;font-weight:bold}
.hint{position:fixed;bottom:12px;right:12px;background:#fff;border-radius:8px;padding:7px 11px;box-shadow:0 4px 20px rgba(26,74,106,.12);font-size:10px;color:#7a7a68;z-index:10}
.hint strong{color:#1a4a6a}
#screen-subject{background:#f5efe0;overflow-y:auto}
.subject-page{max-width:900px;margin:0 auto;padding:30px 30px 80px}
.back-btn{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid #d8c8a0;padding:10px 18px;border-radius:24px;font-family:inherit;font-size:12.5px;color:#1a4a6a;cursor:pointer;margin-bottom:24px}
.back-btn:hover{background:#1a4a6a;color:#fff;border-color:#1a4a6a}
.subject-header{background:#fff;border-radius:16px;padding:32px 36px;margin-bottom:24px;border-top:6px solid #1a4a6a;box-shadow:0 4px 20px rgba(26,74,106,.08)}
.subject-header.done{border-top-color:#c9a84a}
.subject-num{display:inline-block;width:56px;height:56px;border-radius:50%;background:#1a4a6a;color:#fff;font-size:24px;font-weight:bold;line-height:56px;text-align:center;margin-bottom:16px}
.subject-header.done .subject-num{background:#c9a84a}
.subject-tag{display:inline-block;background:#f0e8d0;color:#8a5a1a;font-size:10px;letter-spacing:2px;padding:4px 12px;border-radius:12px;text-transform:uppercase;margin-left:12px;vertical-align:middle;margin-bottom:16px}
.subject-tag.done{background:#c9a84a;color:#fff}
.subject-header h1{font-size:28px;color:#1a3a3a;margin-bottom:8px}
.subject-week{font-size:12.5px;color:#8a8a78;margin-bottom:16px}
.subject-week strong{color:#1a4a6a}
.subject-def{background:#f5efe0;border-left:4px solid #1a4a6a;padding:14px 18px;border-radius:6px;font-size:13.5px;font-style:italic;color:#3a3a3a;line-height:1.55}
.progress-block{background:#fff;border-radius:14px;padding:20px 28px;margin-bottom:24px;box-shadow:0 2px 12px rgba(26,74,106,.06)}
.progress-label{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;font-size:13px;color:#3a3a3a}
.progress-label .num{font-size:22px;font-weight:bold;color:#1a4a6a}
.progress-bar-lg{height:10px;background:#f0e8d0;border-radius:5px;overflow:hidden}
.progress-bar-lg>div{height:100%;background:linear-gradient(90deg,#c9a84a,#e0c878);transition:width .4s}
.section-label{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#8a5a1a;margin:28px 0 14px;padding-bottom:8px;border-bottom:1px solid #e0d8c0;display:flex;justify-content:space-between;align-items:center}
.materials-list{display:flex;flex-direction:column;gap:14px}
.material-card{background:#fff;border-radius:12px;padding:18px 22px;border:2px solid transparent;transition:all .2s;box-shadow:0 2px 8px rgba(26,74,106,.04)}
.material-card:hover{border-color:#e0d8c0}
.material-card.done{background:#fdf8ed;border-color:#c9a84a}
.material-top{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px}
.material-check{flex-shrink:0;width:28px;height:28px;border:2px solid #c9a84a;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;cursor:pointer;margin-top:2px}
.material-card.done .material-check{background:#c9a84a}
.material-card.done .material-check::after{content:'✓';color:#fff;font-weight:bold;font-size:16px}
.material-info{flex:1;min-width:0}
.material-name{font-size:15.5px;font-weight:bold;color:#1a4a6a;margin-bottom:6px;line-height:1.4}
.material-source{font-size:12.5px;color:#8a5a1a;font-style:italic;margin-bottom:6px}
.material-type{font-size:11.5px;color:#8a8a78;margin-bottom:6px}
.material-preview{font-size:12.5px;color:#5a5a4a;font-style:italic;line-height:1.5}
.material-buttons{display:flex;gap:10px;padding-left:42px;flex-wrap:wrap}
.btn-source{display:inline-flex;align-items:center;gap:6px;background:#1a4a6a;color:#fff;padding:9px 16px;border-radius:22px;font-size:12px;font-weight:bold;transition:all .2s;font-family:inherit;border:2px solid #1a4a6a;cursor:pointer}
.btn-source:hover{background:#c9a84a;border-color:#c9a84a}
.btn-source::after{content:' →';font-weight:bold}
.btn-conspect{display:inline-flex;align-items:center;gap:6px;background:transparent;color:#8a5a1a;padding:9px 16px;border-radius:22px;font-family:inherit;font-size:12px;font-weight:bold;transition:all .2s;border:2px solid #c9a84a;cursor:pointer}
.btn-conspect:hover{background:#f0e8d0}
.empty-state{background:#fff;border-radius:14px;padding:40px;text-align:center;color:#8a8a78;font-style:italic;box-shadow:0 2px 12px rgba(26,74,106,.06)}
.empty-state h3{font-style:normal;color:#1a4a6a;font-size:17px;margin-bottom:10px}
.artifact-card{background:#fff;border-radius:14px;padding:26px 30px;margin-top:32px;border-top:6px solid #c9a84a;box-shadow:0 4px 20px rgba(26,74,106,.08)}
.artifact-header{display:flex;align-items:flex-start;gap:16px;margin-bottom:6px}
.artifact-icon{flex-shrink:0;width:48px;height:48px;border:2px solid #c9a84a;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;color:#c9a84a;font-weight:bold}
.artifact-content{flex:1;min-width:0}
.artifact-content .label{color:#8a5a1a;font-size:10px;letter-spacing:2.5px;font-weight:bold;margin-bottom:6px}
.artifact-title{font-size:19px;color:#1a3a3a;font-weight:bold;margin-bottom:4px;line-height:1.35}
.artifact-duration{font-size:12.5px;color:#8a8a78;font-style:italic}
.artifact-body{margin-top:20px;padding-top:20px;border-top:1px solid #e0d8c0}
.artifact-goal{font-size:14.5px;line-height:1.75;color:#2a2a2a;margin-bottom:18px}
.artifact-goal strong{color:#1a4a6a;font-weight:bold}
.artifact-steps{font-size:14.5px;color:#2a2a2a;margin-bottom:18px}
.artifact-steps strong{color:#1a4a6a;font-weight:bold;display:block;margin-bottom:10px}
.artifact-steps ol{padding-left:24px}
.artifact-steps li{line-height:1.75;margin:10px 0}
.artifact-criterion{font-size:14.5px;color:#2a3a2a;line-height:1.75;background:#f0f6ee;border-left:4px solid #1a5c3a;padding:16px 20px;border-radius:6px}
.artifact-criterion strong{color:#1a5c3a;font-weight:bold}
.media-block{margin-top:0}
.media-card{background:#fff;border-radius:14px;padding:22px 26px;margin-bottom:14px;border-left:6px solid #8a5a1a;box-shadow:0 2px 12px rgba(26,74,106,.06)}
.media-kind{display:inline-block;background:#8a5a1a;color:#fff;font-size:10px;letter-spacing:2px;padding:3px 10px;border-radius:10px;text-transform:uppercase;margin-bottom:10px}
.media-kind.music{background:#1a4a6a}
.media-name{font-size:16.5px;color:#1a3a3a;font-weight:bold;margin-bottom:4px;line-height:1.35}
.media-author{font-size:12.5px;color:#8a5a1a;font-style:italic;margin-bottom:10px}
.media-note{font-size:14px;line-height:1.7;color:#3a3a3a}
.complete-btn{display:block;width:100%;margin-top:32px;padding:18px 24px;border-radius:14px;border:2px solid #c9a84a;background:transparent;color:#8a5a1a;font-family:inherit;font-size:15px;font-weight:bold;letter-spacing:2px;cursor:pointer;transition:all .25s;text-transform:uppercase}
.complete-btn:hover:not(:disabled){background:#c9a84a;color:#fff}
.complete-btn:disabled{opacity:.45;cursor:not-allowed}
.complete-btn.ready{background:#c9a84a;color:#fff}
.complete-btn.done{background:#1a5c3a;border-color:#1a5c3a;color:#fff}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:#1a5c3a;color:#fff;padding:16px 32px;border-radius:30px;font-size:13px;box-shadow:0 8px 30px rgba(26,92,58,.4);transition:transform .4s;z-index:1000;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(26,42,58,.75);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:18px;max-width:860px;width:100%;max-height:calc(100vh - 40px);overflow-y:auto;position:relative}
.modal-close{position:sticky;top:12px;float:right;margin:12px 16px 0 0;background:#f5efe0;border:none;width:36px;height:36px;border-radius:50%;font-size:18px;color:#8a5a1a;cursor:pointer;z-index:2}
.modal-close:hover{background:#c9a84a;color:#fff}
.modal-header{padding:36px 48px 24px;border-bottom:1px solid #e0d8c0}
.modal-tag{display:inline-block;background:#1a4a6a;color:#fff;font-size:10px;letter-spacing:2px;padding:4px 12px;border-radius:12px;text-transform:uppercase;margin-bottom:14px}
.modal-header h2{font-size:26px;color:#1a3a3a;line-height:1.3;margin-bottom:10px;font-weight:bold}
.modal-header .meta{font-size:13.5px;color:#8a5a1a;font-style:italic}
.modal-body{padding:32px 48px 40px}
.modal-body h3{font-size:17px;color:#1a4a6a;margin:36px 0 16px;padding-bottom:8px;border-bottom:2px solid #f0e8d0;font-weight:bold}
.modal-body h3:first-child{margin-top:0}
.modal-body p{font-size:16px;line-height:1.85;color:#2a2a2a;margin-bottom:18px;text-align:justify}
.modal-body ul{padding-left:26px;margin-bottom:18px}
.modal-body li{font-size:15.5px;line-height:1.75;color:#2a2a2a;margin:12px 0;text-align:justify}
.modal-body li strong{color:#1a4a6a}
.modal-body .key-idea{background:#f0f6ee;border-left:4px solid #1a5c3a;padding:18px 24px;border-radius:6px;margin:24px 0;font-size:15.5px;color:#2a3a2a;line-height:1.7;font-style:italic}
.modal-body .key-idea::before{content:'💡 Ключевая мысль: ';font-weight:bold;font-style:normal;color:#1a5c3a}
.modal-body .example{background:#fdf8ed;border:1px solid #e0d8c0;border-radius:8px;padding:18px 24px;margin:20px 0;font-size:15.5px;line-height:1.8;color:#3a3a3a}
.modal-body .example::before{content:'📌 ПРИМЕР';display:block;font-size:10px;letter-spacing:2px;color:#8a5a1a;font-weight:bold;margin-bottom:10px;font-style:normal}
.modal-body .epistemic{background:#fafaf5;border:1px solid #e0d8c0;border-radius:8px;padding:16px 20px;margin:20px 0;font-size:14px;line-height:1.7;color:#3a3a3a}
.modal-body .epistemic::before{content:'⚖ ЧТО ЗДЕСЬ ДАННЫЕ, МОДЕЛЬ, ПОЗИЦИЯ И ЧТО НЕИЗВЕСТНО';display:block;font-size:10px;letter-spacing:2px;color:#8a5a1a;font-weight:bold;margin-bottom:10px;font-style:normal}
.modal-body .epistemic .row{margin-bottom:8px}
.modal-body .epistemic .row b{color:#1a4a6a;font-size:12.5px;letter-spacing:1px;text-transform:uppercase}
.modal-body .epistemic .row:last-child{margin-bottom:0}
.modal-body .for-advanced{background:#f0f6ee;border-left:4px solid #1a5c3a;padding:16px 20px;margin:24px 0 0;font-size:14.5px;line-height:1.75;color:#2a3a2a;font-style:italic;border-radius:6px}
.modal-body .for-advanced::before{content:'↻ ДЛЯ ТЕХ, КТО ПРОШЁЛ ЛИНЕЙКУ';display:block;font-size:10px;letter-spacing:2px;color:#1a5c3a;font-weight:bold;margin-bottom:10px;font-style:normal}
.modal-footer{padding:20px 48px 28px;background:#fafaf5;border-top:1px solid #e0d8c0;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.modal-footer .actions{display:flex;gap:10px;margin-left:auto}
.btn-done{padding:12px 22px;border-radius:22px;border:2px solid #c9a84a;background:transparent;color:#8a5a1a;font-family:inherit;font-size:12.5px;font-weight:bold;cursor:pointer;text-transform:uppercase}
.btn-done:hover{background:#c9a84a;color:#fff}
.btn-done.done{background:#1a5c3a;border-color:#1a5c3a;color:#fff}
.sources-modal{background:#fff;border-radius:18px;max-width:780px;width:100%;max-height:calc(100vh - 40px);overflow-y:auto;position:relative}
.sources-progress{padding:0 48px 20px;border-bottom:1px solid #e0d8c0}
.sources-progress .lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:#8a8a78;margin-bottom:8px}
.sources-progress .lbl .num{font-size:17px;font-weight:bold;color:#1a4a6a}
.sources-progress .bar{height:6px;background:#f0e8d0;border-radius:3px;overflow:hidden}
.sources-progress .bar>div{height:100%;background:linear-gradient(90deg,#c9a84a,#e0c878)}
.sources-list{padding:24px 48px 8px}
.source-item{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;border-radius:10px;background:#fff;border:1.5px solid #f0e8d0;margin-bottom:10px}
.source-item.done{background:#fdf8ed;border-color:#c9a84a}
.source-check{flex-shrink:0;width:24px;height:24px;border:2px solid #c9a84a;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;cursor:pointer;margin-top:2px}
.source-item.done .source-check{background:#c9a84a}
.source-item.done .source-check::after{content:'✓';color:#fff;font-weight:bold;font-size:14px}
.source-info{flex:1;min-width:0}
.source-name{font-size:14.5px;font-weight:bold;color:#1a4a6a;line-height:1.4;margin-bottom:4px}
.source-author{font-size:12.5px;color:#8a5a1a;font-style:italic;margin-bottom:3px}
.source-type{font-size:11px;color:#8a8a78}
.source-download{flex-shrink:0;background:#1a5c3a;color:#fff;border:2px solid #1a5c3a;padding:8px 16px;border-radius:16px;font-family:inherit;font-size:11px;font-weight:bold;cursor:pointer;align-self:center;display:flex;align-items:center;gap:6px}
.source-download:hover{background:#c9a84a;border-color:#c9a84a}
.source-download::before{content:'⬇';font-size:13px}
.source-watch{flex-shrink:0;background:#8a5a1a;color:#fff;border:2px solid #8a5a1a;padding:8px 16px;border-radius:16px;font-family:inherit;font-size:11px;font-weight:bold;cursor:pointer;align-self:center;display:flex;align-items:center;gap:6px}
.source-watch:hover{background:#c9a84a;border-color:#c9a84a}
.source-watch::before{content:'▶';font-size:11px}
.sources-footer{padding:20px 48px 28px;background:#fafaf5;border-top:1px solid #e0d8c0;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;font-size:13px;color:#5a5a4a;font-style:italic}
.sources-footer .back-link{font-style:normal;background:transparent;border:2px solid #1a4a6a;color:#1a4a6a;padding:8px 16px;border-radius:16px;font-family:inherit;font-size:12px;font-weight:bold;cursor:pointer}
.sources-footer .back-link:hover{background:#1a4a6a;color:#fff}
.glossary-modal{background:#fff;border-radius:18px;max-width:820px;width:100%;max-height:calc(100vh - 40px);overflow-y:auto;position:relative}
.glossary-list{padding:24px 48px 40px}
.glossary-item{padding:14px 0;border-bottom:1px solid #f0e8d0}
.glossary-item:last-child{border-bottom:none}
.glossary-term{font-size:16px;font-weight:bold;color:#1a4a6a;margin-bottom:6px}
.glossary-def{font-size:14.5px;line-height:1.7;color:#2a2a2a;margin-bottom:6px}
.glossary-ref{font-size:11.5px;color:#8a5a1a;font-style:italic;cursor:pointer}
.glossary-ref:hover{text-decoration:underline}
.glossary-search{padding:0 48px 20px;border-bottom:1px solid #e0d8c0}
.glossary-search input{width:100%;padding:10px 14px;border:1.5px solid #d8c8a0;border-radius:10px;font-family:inherit;font-size:14px;background:#fafaf5}
.glossary-search input:focus{outline:none;border-color:#c9a84a}
.tracks-modal{background:#fff;border-radius:18px;max-width:900px;width:100%;max-height:calc(100vh - 40px);overflow-y:auto;position:relative}
.tracks-list{padding:24px 48px 40px}
.track-card{background:#fafaf5;border-radius:14px;padding:22px 26px;margin-bottom:16px;border-left:6px solid #8a5a1a}
.track-card.done-week{border-left-color:#1a5c3a;background:#f0f6ee}
.track-header{display:flex;align-items:flex-start;gap:14px;margin-bottom:12px}
.track-icon{flex-shrink:0;width:44px;height:44px;border:2px solid #8a5a1a;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;background:#fff}
.track-card.done-week .track-icon{border-color:#1a5c3a}
.track-title-wrap{flex:1;min-width:0}
.track-title{font-size:18px;color:#1a3a3a;font-weight:bold;line-height:1.35;margin-bottom:4px}
.track-freq{font-size:12.5px;color:#8a8a78;font-style:italic}
.track-check-btn{flex-shrink:0;background:transparent;border:2px solid #c9a84a;color:#8a5a1a;padding:8px 14px;border-radius:16px;font-family:inherit;font-size:11px;font-weight:bold;cursor:pointer;text-transform:uppercase;letter-spacing:1px}
.track-check-btn:hover{background:#c9a84a;color:#fff}
.track-card.done-week .track-check-btn{background:#1a5c3a;border-color:#1a5c3a;color:#fff}

<script>
// ============ ИНИЦИАЛИЗАЦИЯ ============
var DB = {};
var LECTURES_LOADED = false;

function computeHash(obj){
  try{
    var keys = Object.keys(obj).sort();
    var parts = [];
    for(var i=0;i<keys.length;i++){
      var k = keys[i];
      var v = obj[k];
      var len = Array.isArray(v) ? v.length : (typeof v === 'object' && v ? Object.keys(v).length : 0);
      parts.push(k + ':' + len);
    }
    var s = parts.join('|');
    var h = 5381;
    for(var j=0;j<s.length;j++){
      h = ((h << 5) + h + s.charCodeAt(j)) | 0;
    }
    return 'v' + (h >>> 0).toString(36);
  }catch(e){
    return 'v0';
  }
}

function initLectures(){
  var c1 = (typeof window.PAIDEIA_LECTURES !== 'undefined' && window.PAIDEIA_LECTURES) ? window.PAIDEIA_LECTURES : {};
  var c2 = (typeof window.PAIDEIA_LECTURES_COURSE2 !== 'undefined' && window.PAIDEIA_LECTURES_COURSE2) ? window.PAIDEIA_LECTURES_COURSE2 : {};
  var c3 = (typeof window.PAIDEIA_LECTURES_COURSE3 !== 'undefined' && window.PAIDEIA_LECTURES_COURSE3) ? window.PAIDEIA_LECTURES_COURSE3 : {};
  var c4 = (typeof window.PAIDEIA_LECTURES_COURSE4 !== 'undefined' && window.PAIDEIA_LECTURES_COURSE4) ? window.PAIDEIA_LECTURES_COURSE4 : {};
  var c5 = (typeof window.PAIDEIA_LECTURES_COURSE5 !== 'undefined' && window.PAIDEIA_LECTURES_COURSE5) ? window.PAIDEIA_LECTURES_COURSE5 : {};
  var c6 = (typeof window.PAIDEIA_LECTURES_COURSE6 !== 'undefined' && window.PAIDEIA_LECTURES_COURSE6) ? window.PAIDEIA_LECTURES_COURSE6 : {};
  var c7 = (typeof window.PAIDEIA_LECTURES_PHILOSOPHY !== 'undefined' && window.PAIDEIA_LECTURES_PHILOSOPHY) ? window.PAIDEIA_LECTURES_PHILOSOPHY : {};
  var fromFiles = Object.assign({}, c1, c2, c3, c4, c5, c6, c7);
  var filesHash = computeHash(fromFiles);
  var filesKeys = Object.keys(fromFiles);

  var cachedHash = '';
  var cachedData = null;
  try{
    cachedHash = localStorage.getItem('paideia-lectures-hash') || '';
    cachedData = localStorage.getItem('paideia-lectures');
  }catch(e){}

  if(filesKeys.length > 0){
    DB = fromFiles;
    try{
      localStorage.setItem('paideia-lectures', JSON.stringify(DB));
      localStorage.setItem('paideia-lectures-hash', filesHash);
    }catch(e){}
  } else if(cachedData){
    try{
      DB = JSON.parse(cachedData);
    }catch(e){
      DB = {};
    }
  } else {
    DB = {};
  }

  LECTURES_LOADED = Object.keys(DB).length > 0;
  return LECTURES_LOADED;
}

// ============ ЗАГРУЗКА ФАЙЛОВ ============
function handleLecturesUpload(input){
  var files = Array.prototype.slice.call(input.files || []);
  if(!files.length) return;
  processLecturesFiles(files);
}

function handleDrop(event){
  event.preventDefault();
  document.getElementById('loading-screen').style.background = '';
  var files = Array.prototype.slice.call(event.dataTransfer.files || []).filter(function(f){
    return /\.(js|json)$/i.test(f.name);
  });
  if(!files.length){ alert('Нужны файлы .js или .json'); return; }
  processLecturesFiles(files);
}

function processLecturesFiles(files){
  var status = document.getElementById('load-status');
  status.textContent = 'Чтение файлов: ' + files.length + '...';

  var totalMerged = {};
  var pending = files.length;
  var errors = [];

  files.forEach(function(file){
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var data = parseLecturesFile(e.target.result);
        if(!data) throw new Error('объект лекций не найден');
        var keys = Object.keys(data);
        for(var i=0;i<keys.length;i++){
          totalMerged[keys[i]] = data[keys[i]];
        }
      }catch(err){
        errors.push(file.name + ': ' + err.message);
      }
      pending--;
      if(pending === 0) finishImport(totalMerged, errors, status);
    };
    reader.onerror = function(){
      errors.push(file.name + ': не удалось прочитать');
      pending--;
      if(pending === 0) finishImport(totalMerged, errors, status);
    };
    reader.readAsText(file);
  });
}

function finishImport(merged, errors, status){
  var keys = Object.keys(merged);
  if(keys.length === 0){
    status.textContent = 'Ошибка: ни один файл не удалось прочитать.\n' + errors.join('\n');
    return;
  }
  try{
    var existing = {};
    try{ existing = JSON.parse(localStorage.getItem('paideia-lectures') || '{}'); }catch(e){}
    var combined = Object.assign({}, existing, merged);
    localStorage.setItem('paideia-lectures', JSON.stringify(combined));
  }catch(err){
    status.textContent = 'Ошибка сохранения: ' + err.message;
    return;
  }
  var msg = 'Загружено ключей: ' + keys.length + '.\n';
  if(errors.length) msg += 'Ошибки в файлах:\n' + errors.join('\n') + '\n';
  msg += 'Перезапуск...';
  status.textContent = msg;
  setTimeout(function(){location.reload()}, 1200);
}

// ============ ПАРСЕР ============
function parseLecturesFile(src){
  try{
    var sandbox = {
      PAIDEIA_LECTURES: undefined,
      PAIDEIA_LECTURES_COURSE2: undefined,
      PAIDEIA_LECTURES_COURSE3: undefined,
      PAIDEIA_LECTURES_COURSE4: undefined,
      PAIDEIA_LECTURES_COURSE5: undefined,
      PAIDEIA_LECTURES_COURSE6: undefined,
      PAIDEIA_LECTURES_PHILOSOPHY: undefined
    };
    var fn = new Function('window',
      'var PAIDEIA_LECTURES, PAIDEIA_LECTURES_COURSE2, PAIDEIA_LECTURES_COURSE3, PAIDEIA_LECTURES_COURSE4, PAIDEIA_LECTURES_COURSE5, PAIDEIA_LECTURES_COURSE6, PAIDEIA_LECTURES_PHILOSOPHY;\n' + src + '\n' +
      'return (typeof PAIDEIA_LECTURES_PHILOSOPHY !== "undefined" && PAIDEIA_LECTURES_PHILOSOPHY) || (typeof PAIDEIA_LECTURES_COURSE6 !== "undefined" && PAIDEIA_LECTURES_COURSE6) || (typeof PAIDEIA_LECTURES_COURSE5 !== "undefined" && PAIDEIA_LECTURES_COURSE5) || (typeof PAIDEIA_LECTURES_COURSE4 !== "undefined" && PAIDEIA_LECTURES_COURSE4) || (typeof PAIDEIA_LECTURES_COURSE3 !== "undefined" && PAIDEIA_LECTURES_COURSE3) || (typeof PAIDEIA_LECTURES_COURSE2 !== "undefined" && PAIDEIA_LECTURES_COURSE2) || (typeof PAIDEIA_LECTURES !== "undefined" && PAIDEIA_LECTURES) || window.PAIDEIA_LECTURES_PHILOSOPHY || window.PAIDEIA_LECTURES || window.PAIDEIA_LECTURES_COURSE2 || window.PAIDEIA_LECTURES_COURSE3 || window.PAIDEIA_LECTURES_COURSE4 || window.PAIDEIA_LECTURES_COURSE5 || window.PAIDEIA_LECTURES_COURSE6;'
    );
    var result = fn(sandbox);
    if(result && typeof result === 'object' && !Array.isArray(result)) return result;
  }catch(e){
    console.warn('new Function недоступен:', e.message);
  }
  return parseLecturesFileManual(src);
}

function parseLecturesFileManual(src){
  var i = 0, n = src.length;
  function skipWs(){
    while(i < n){
      var c = src[i];
      if(c === ' ' || c === '\t' || c === '\n' || c === '\r'){ i++; continue; }
      if(c === '/' && src[i+1] === '/'){ while(i < n && src[i] !== '\n') i++; continue; }
      if(c === '/' && src[i+1] === '*'){ i += 2; while(i < n-1 && !(src[i] === '*' && src[i+1] === '/')) i++; i += 2; continue; }
      break;
    }
  }
  function parseValue(){
    skipWs();
    var c = src[i];
    if(c === '{') return parseObject();
    if(c === '[') return parseArray();
    if(c === '"' || c === "'") return parseString();
    if(c === '-' || (c >= '0' && c <= '9')) return parseNumber();
    if(src.substr(i,4) === 'true'){ i += 4; return true; }
    if(src.substr(i,5) === 'false'){ i += 5; return false; }
    if(src.substr(i,4) === 'null'){ i += 4; return null; }
    throw new Error('Неожиданный символ на позиции ' + i);
  }
  function parseObject(){
    i++;
    var obj = {};
    skipWs();
    if(src[i] === '}'){ i++; return obj; }
    while(true){
      skipWs();
      var key;
      if(src[i] === '"' || src[i] === "'") key = parseString();
      else{
        var start = i;
        while(i < n && /[A-Za-z0-9_$\-]/.test(src[i])) i++;
        if(start === i) throw new Error('Ожидался ключ на позиции ' + i);
        key = src.slice(start, i);
      }
      skipWs();
      if(src[i] !== ':') throw new Error('Ожидалось ":"');
      i++;
      obj[key] = parseValue();
      skipWs();
      if(src[i] === ','){ i++; continue; }
      if(src[i] === '}'){ i++; return obj; }
      throw new Error('Ожидалось "," или "}"');
    }
  }
  function parseArray(){
    i++;
    var arr = [];
    skipWs();
    if(src[i] === ']'){ i++; return arr; }
    while(true){
      arr.push(parseValue());
      skipWs();
      if(src[i] === ','){ i++; continue; }
      if(src[i] === ']'){ i++; return arr; }
      throw new Error('Ожидалось "," или "]"');
    }
  }
  function parseString(){
    var q = src[i]; i++;
    var s = '';
    while(i < n && src[i] !== q){
      if(src[i] === '\\'){
        var esc = src[i+1];
        if(esc === 'n') s += '\n';
        else if(esc === 't') s += '\t';
        else if(esc === 'r') s += '\r';
        else if(esc === '\\') s += '\\';
        else if(esc === q) s += q;
        else if(esc === 'u'){ s += String.fromCharCode(parseInt(src.substr(i+2,4), 16)); i += 4; }
        else s += esc;
        i += 2;
      } else { s += src[i++]; }
    }
    i++;
    return s;
  }
  function parseNumber(){
    var start = i;
    if(src[i] === '-') i++;
    while(i < n && /[0-9.eE+\-]/.test(src[i])) i++;
    return Number(src.slice(start, i));
  }

  var re = /(PAIDEIA_LECTURES_PHILOSOPHY|PAIDEIA_LECTURES_COURSE6|PAIDEIA_LECTURES_COURSE5|PAIDEIA_LECTURES_COURSE4|PAIDEIA_LECTURES_COURSE3|PAIDEIA_LECTURES_COURSE2|PAIDEIA_LECTURES)\s*=\s*/g;
  var lastMatch = null, m;
  while((m = re.exec(src)) !== null) lastMatch = m;
  if(!lastMatch) throw new Error('Не найдено объявление переменной');
  i = lastMatch.index + lastMatch[0].length;

function enterCourse(id){
  if(!COURSES[id]) return;
  activeCourse = id;
  var c = COURSES[id];
  NODES = c.nodes;
  EDGES = c.edges;
  SCHEDULE = c.schedule;
  TRACKABLE = c.trackable;
  document.getElementById('subtitle-bar').textContent = c.subtitle;
  try{localStorage.setItem('paideia-active-course', id)}catch(e){}
  renderControls();
  animateViewBox({x:c.viewBox.x, y:c.viewBox.y, w:c.viewBox.w, h:c.viewBox.h}, 300);
}

function exitCourse(){
  activeCourse = null;
  NODES = HOME_NODES;
  EDGES = HOME_EDGES;
  SCHEDULE = {};
  TRACKABLE = [];
  document.getElementById('subtitle-bar').textContent = 'становление собой';
  try{localStorage.setItem('paideia-active-course', '')}catch(e){}
  renderControls();
  animateViewBox({x:HOME_VIEWBOX.x, y:HOME_VIEWBOX.y, w:HOME_VIEWBOX.w, h:HOME_VIEWBOX.h}, 300);
}

var STORAGE_KEY='paideia-v20',START_KEY='paideia-start-v20';
var BACKUP_KEY=STORAGE_KEY+'-backup',BACKUP_TS_KEY=STORAGE_KEY+'-backup-ts';
var BACKUP_INTERVAL=10*60*1000;
var state={materials:{},subjects:{},sources:{},tracks:{}},startDate='';
try{
  var saved=localStorage.getItem(STORAGE_KEY);
  if(!saved){
    var backup = localStorage.getItem(BACKUP_KEY);
    if(backup){
      saved = backup;
      console.info('Прогресс восстановлен из резервной копии');
    }
  }
  if(saved){var p=JSON.parse(saved);if(p.materials)state.materials=p.materials;if(p.subjects)state.subjects=p.subjects;if(p.sources)state.sources=p.sources;if(p.tracks)state.tracks=p.tracks}
  startDate=localStorage.getItem(START_KEY)||'';
}catch(e){}

function save(){
  try{
    var payload=JSON.stringify({materials:state.materials,subjects:state.subjects,sources:state.sources,tracks:state.tracks});
    localStorage.setItem(STORAGE_KEY,payload);
    var lastTs=parseInt(localStorage.getItem(BACKUP_TS_KEY)||'0',10);
    if(Date.now()-lastTs>BACKUP_INTERVAL){
      localStorage.setItem(BACKUP_KEY,payload);
      localStorage.setItem(BACKUP_TS_KEY,String(Date.now()));
    }
  }catch(e){}
}
function saveStart(){try{localStorage.setItem(START_KEY,startDate)}catch(e){}}
function isSubjectDone(id){return!!state.subjects[id]}
function isMaterialDone(id,mid){return!!(state.materials[id]&&state.materials[id][mid])}
function isSourceDone(sid){return!!state.sources[sid]}
function toggleSource(sid,subjId,lecId){state.sources[sid]=!state.sources[sid];save();openSources(subjId,lecId);renderSubject(subjId)}
function getMats(id){return DB[id]||[]}
function countMats(id){var m=getMats(id),c=0;for(var i=0;i<m.length;i++)if(isMaterialDone(id,m[i].id))c++;return c}
function allDone(id){var m=getMats(id);if(!m.length)return false;return countMats(id)===m.length}
function toggleMat(id,mid){if(!state.materials[id])state.materials[id]={};state.materials[id][mid]=!state.materials[id][mid];save();renderSubject(id)}
function completeSubj(id){if(isSubjectDone(id)){state.subjects[id]=false}else{state.subjects[id]=true}save();renderSubject(id);render();updateTotal();if(state.subjects[id])showToast('✓ «'+(NODES[id]?NODES[id].title:id)+'» изучен')}
function resetProgress(){if(!confirm('Сбросить весь прогресс?'))return;state={materials:{},subjects:{},sources:{},tracks:{}};save();render();updateTotal()}

function countCourseProgressById(courseId){
  var trackable;
  if(courseId === 'course1') trackable = TRACKABLE1;
  else if(courseId === 'course2') trackable = TRACKABLE2;
  else if(courseId === 'course3') trackable = TRACKABLE3;
  else if(courseId === 'course4') trackable = TRACKABLE4;
  else if(courseId === 'course5') trackable = TRACKABLE5;
  else if(courseId === 'course6') trackable = TRACKABLE6;
  else if(courseId === 'course7') trackable = TRACKABLE7;
  else trackable = [];
  var total = 0, done = 0;
  for(var i=0;i<trackable.length;i++){
    if(getMats(trackable[i]).length === 0) continue;
    total++;
    if(isSubjectDone(trackable[i])) done++;
  }
  return {total:total, done:done};
}

function countAdditionalProgress(courseId){
  var list;
  if(courseId === 'course2') list = ADDITIONAL2;
  else if(courseId === 'course3') list = ADDITIONAL3;
  else if(courseId === 'course4') list = ADDITIONAL4;
  else if(courseId === 'course7') list = ADDITIONAL7;
  else return {total:0, done:0};
  var total = 0, done = 0;
  for(var i=0;i<list.length;i++){
    if(getMats(list[i]).length === 0) continue;
    total++;
    if(isSubjectDone(list[i])) done++;
  }
  return {total:total, done:done};
}

function updateTotal(){
  var el = document.querySelector('#controls-panel .total-progress');
  if(!el) return;
  if(activeCourse){

    if(activeCourse === 'course2' || activeCourse === 'course3' || activeCourse === 'course4' || activeCourse === 'course7'){
      var addProg = countAdditionalProgress(activeCourse);
      if(addProg.total > 0) sub += '<br>Дополнительно: ' + addProg.done + '/' + addProg.total;
    }
    if(activeCourse === 'course7') el.classList.add('philosophy'); else el.classList.remove('philosophy');
    el.innerHTML = '<div class="label">ПРОГРЕСС КУРСА</div><div class="value">'+prog.done+' / '+prog.total+'</div><div class="sub">'+sub+'</div><div class="bar"><div style="width:'+(prog.total?prog.done/prog.total*100:0)+'%"></div></div>';
  } else {
    el.classList.remove('philosophy');
    var p1 = countCourseProgressById('course1');
    var p2 = countCourseProgressById('course2');
    var p3 = countCourseProgressById('course3');
    var p4 = countCourseProgressById('course4');
    var p5 = countCourseProgressById('course5');
    var p6 = countCourseProgressById('course6');
    var p7 = countCourseProgressById('course7');
    var a2 = countAdditionalProgress('course2');
    var a3 = countAdditionalProgress('course3');
    var a4 = countAdditionalProgress('course4');
    var a7 = countAdditionalProgress('course7');
    var total = p1.total + p2.total + p3.total + p4.total + p5.total + p6.total + p7.total;
    var done = p1.done + p2.done + p3.done + p4.done + p5.done + p6.done + p7.done;
    var subHtml = 'Самопознание: '+p1.done+'/'+p1.total+
                  '<br>Критическое мышление: '+p2.done+'/'+p2.total;
    if(a2.total > 0) subHtml += ' (+'+a2.done+'/'+a2.total+')';
    subHtml += '<br>Этика действия: '+p3.done+'/'+p3.total;
    if(a3.total > 0) subHtml += ' (+'+a3.done+'/'+a3.total+')';
    subHtml += '<br>Понимание людей и систем: '+p4.done+'/'+p4.total;
    if(a4.total > 0) subHtml += ' (+'+a4.done+'/'+a4.total+')';
    subHtml += '<br>Дело: '+p5.done+'/'+p5.total;
    subHtml += '<br>Путь: '+p6.done+'/'+p6.total;
    subHtml += '<br>Философия · ВШЭ: '+p7.done+'/'+p7.total;
    if(a7.total > 0) subHtml += ' (+'+a7.done+'/'+a7.total+')';
    el.innerHTML = '<div class="label">ОБЩИЙ ПРОГРЕСС</div><div class="value">'+done+' / '+total+'</div><div class="sub">'+subHtml+'</div><div class="bar"><div style="width:'+(total?done/total*100:0)+'%"></div></div>';
  }
}

function setStartDate(v){startDate=v;saveStart();updateStartDisplay();render()}
function updateStartDisplay(){
  var d=document.getElementById('start-display'),i=document.getElementById('start-input');
  if(!d||!i)return;
  if(!startDate){
    var t = new Date();
    var y = t.getFullYear();
    var m = ('0'+(t.getMonth()+1)).slice(-2);
    var dd = ('0'+t.getDate()).slice(-2);
    startDate = y+'-'+m+'-'+dd;
    saveStart();
  }
  var dt=new Date(startDate);
  d.textContent=dt.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
  i.value=startDate;
}
function getCurWeek(){if(!startDate)return null;var s=new Date(startDate),n=new Date();var d=Math.floor((n-s)/86400000);if(d<0)return 0;var w=Math.floor(d/7)+1;if(w>32)return 33;return w}
function getStatus(id){if(isSubjectDone(id))return'done';var sc=SCHEDULE[id];if(!sc)return'future';var c=getCurWeek();if(c===null||c===0)return'future';if(c>sc.weeks[sc.weeks.length-1])return'past';if(c>=sc.weeks[0]&&c<=sc.weeks[sc.weeks.length-1])return'current';return'future'}

function showScreen(n){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active')});document.getElementById('screen-'+n).classList.add('active');if(n==='subject')document.getElementById('screen-subject').scrollTop=0}

function isOpenableNode(id){
  var node = NODES[id];
  if(!node) return false;
  return node.type === 'subject' || node.type === 'integration' || node.type === 'final';
}
function openSubject(id){if(!isOpenableNode(id))return;renderSubject(id);showScreen('subject')}
function backToMap(){showScreen('map');render();updateTotal()}

function exportProgress(){
  var data = {version:'paideia-v20',exported:new Date().toISOString(),startDate:startDate,materials:state.materials,subjects:state.subjects,sources:state.sources,tracks:state.tracks};
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var d = new Date();
  a.href = url;
  a.download = 'progress-' + d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2) + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url)}, 1000);
  showToast('Прогресс сохранён');
}

function importProgress(input){
  var file = input.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var data = JSON.parse(e.target.result);
      if(!data.materials && !data.subjects && !data.sources) throw new Error('Неверный формат');
      if(!confirm('Заменить текущий прогресс загруженным?')){input.value='';return}
      state.materials = data.materials || {};
      state.subjects = data.subjects || {};
      state.sources = data.sources || {};
      state.tracks = data.tracks || {};
      if(data.startDate){startDate = data.startDate; saveStart()}
      save(); updateStartDisplay(); render(); updateTotal();
      showToast('Прогресс загружен');
    }catch(err){showToast('Ошибка: ' + err.message)}
    input.value = '';
  };
  reader.readAsText(file);
}

function openGlossary(){
  var html = '<button class="modal-close" onclick="closeGlossary()">×</button>';
  html += '<div class="modal-header"><div class="modal-tag">Справочник</div><h2>Глоссарий</h2><div class="meta">'+GLOSSARY.length+' терминов</div></div>';
  html += '<div class="glossary-search"><input type="text" id="gloss-search" placeholder="Поиск термина..." oninput="filterGlossary(this.value)"></div>';
  html += '<div class="glossary-list" id="gloss-list">';
  for(var i=0;i<GLOSSARY.length;i++){
    var g = GLOSSARY[i];
    var ref = g.ref;
    var nodeTitle = ref;
    if(ref.indexOf('course6_') === 0 && COURSE6_NODES[ref]) nodeTitle = COURSE6_NODES[ref].title;
    else if(ref.indexOf('course5_') === 0 && COURSE5_NODES[ref]) nodeTitle = COURSE5_NODES[ref].title;
    else if(ref.indexOf('course4_') === 0 && COURSE4_NODES[ref]) nodeTitle = COURSE4_NODES[ref].title;
    else if(ref.indexOf('course3_') === 0 && COURSE3_NODES[ref]) nodeTitle = COURSE3_NODES[ref].title;
    else if(ref.indexOf('course2_') === 0 && COURSE2_NODES[ref]) nodeTitle = COURSE2_NODES[ref].title;
    else if(ref.indexOf('phil_') === 0 && COURSE7_NODES[ref]) nodeTitle = COURSE7_NODES[ref].title;
    else if(COURSE1_NODES[ref]) nodeTitle = COURSE1_NODES[ref].title;
    html += '<div class="glossary-item" data-term="'+g.t.toLowerCase()+'"><div class="glossary-term">'+g.t+'</div><div class="glossary-def">'+g.d+'</div><div class="glossary-ref" onclick="openGlossaryRef(\''+escJs(ref)+'\')">→ '+nodeTitle+'</div></div>';
  }
  html += '</div>';
  glossaryContent.innerHTML = html;
  glossaryBg.classList.add('open');
}
function closeGlossary(){glossaryBg.classList.remove('open')}
function filterGlossary(q){
  q = (q||'').toLowerCase().trim();
  var items = document.querySelectorAll('#gloss-list .glossary-item');
  for(var i=0;i<items.length;i++){
    var t = items[i].getAttribute('data-term') || '';
    items[i].style.display = (!q || t.indexOf(q) !== -1) ? '' : 'none';
  }
}
function openGlossaryRef(ref){
  closeGlossary();
  var targetCourse = 'course1';
  if(ref.indexOf('course2_') === 0) targetCourse = 'course2';
  else if(ref.indexOf('course3_') === 0) targetCourse = 'course3';
  else if(ref.indexOf('course4_') === 0) targetCourse = 'course4';
  else if(ref.indexOf('course5_') === 0) targetCourse = 'course5';
  else if(ref.indexOf('course6_') === 0) targetCourse = 'course6';
  else if(ref.indexOf('phil_') === 0) targetCourse = 'course7';
  if(activeCourse !== targetCourse){ enterCourse(targetCourse); }
  if(isOpenableNode(ref)){ openSubject(ref); }
  else { focusNode(ref); }
}

var canvas = document.getElementById('canvas'), NS = 'http://www.w3.org/2000/svg';

function el(tag,attrs,text){var e=document.createElementNS(NS,tag);for(var k in attrs)if(attrs[k]!==undefined&&attrs[k]!==null)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;return e}

var animFrame = null;
function animateViewBox(target, duration){
  if(animFrame){ cancelAnimationFrame(animFrame); animFrame = null; }
  duration = duration || 250;
  var start = { x: vb.x, y: vb.y, w: vb.w, h: vb.h };
  var startT = performance.now();
  function step(t){
    var k = Math.min(1, (t - startT) / duration);
    var e = k < 0.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
    vb.x = start.x + (target.x - start.x) * e;
    vb.y = start.y + (target.y - start.y) * e;
    vb.w = start.w + (target.w - start.w) * e;
    vb.h = start.h + (target.h - start.h) * e;
    render();
    if(k < 1){ animFrame = requestAnimationFrame(step); }
    else { animFrame = null; }
  }
  animFrame = requestAnimationFrame(step);
}

function render(){
  canvas.innerHTML='';
  canvas.setAttribute('viewBox',vb.x+' '+vb.y+' '+vb.w+' '+vb.h);
  canvas.appendChild(el('rect',{x:vb.x,y:vb.y,width:vb.w,height:vb.h,fill:'#f5efe0'}));
  [200,350,500,650].forEach(function(r){canvas.appendChild(el('circle',{cx:0,cy:0,r:r,fill:'none',stroke:'#d8d0bb','stroke-width':1,opacity:0.35}))});
  EDGES.forEach(function(edge){
    var f=NODES[edge.from],t=NODES[edge.to];if(!f||!t)return;
    var st=activeCourse?getStatus(edge.to):null;
    var stroke=COLORS.edge[edge.style]||'#8a8070';
    var w=edge.style==='main'?5:(edge.style==='course'?3:(edge.style==='philosophy'?3.5:(edge.style==='future'?3:(edge.style==='final'?2.5:1.5))));
    var op=edge.style==='main'?0.7:(edge.style==='course'?0.6:(edge.style==='philosophy'?0.65:(edge.style==='future'?0.5:(edge.style==='final'?0.5:0.35))));
    if(st==='done'){stroke=COLORS.done;op=0.85;w=Math.max(w,4)}
    else if(st==='current'){stroke=COLORS.current;op=0.75;w=Math.max(w,3)}
    else if(st==='past'){stroke=COLORS.past;op=0.55;w=Math.max(w,2.5)}
    canvas.appendChild(el('line',{x1:f.x,y1:f.y,x2:t.x,y2:t.y,stroke:stroke,'stroke-width':w,opacity:op,'stroke-linecap':'round','stroke-dasharray':(edge.style==='future'||edge.style==='final')?'8,6':'none'}));
  });
  Object.keys(NODES).forEach(function(id){drawNode(NODES[id])});

  var status = (trackable || isAdd) ? getStatus(node.id) : null;
  var isAdditional = (node.type === 'additional') || /^course2_d[1-4]$/.test(node.id) || /^course3_d[1-4]$/.test(node.id) || /^course4_d[1-4]$/.test(node.id) || /^phil_d[1-4]$/.test(node.id);
  var color;

  }

function drawTimeline(){
  var maxNodeY = 0;
  Object.keys(NODES).forEach(function(id){
    var n = NODES[id];
    if(n.y + n.r > maxNodeY) maxNodeY = n.y + n.r;
  });
  var maxWeek = 12;
  Object.keys(SCHEDULE).forEach(function(id){
    var w = SCHEDULE[id].weeks[SCHEDULE[id].weeks.length-1];
    if(w > maxWeek) maxWeek = w;
  });

  var tlY = maxNodeY + 90;
  var courseVb = activeCourse ? COURSES[activeCourse].viewBox : HOME_VIEWBOX;
  var x1 = courseVb.x + 80;
  var x2 = courseVb.x + courseVb.w - 80;
  var w = x2 - x1;
  var ww = w / maxWeek;
  var cur = getCurWeek();

  canvas.appendChild(el('text',{
    x:0, y:tlY-30, 'text-anchor':'middle',
    'font-family':'Georgia, serif','font-size':12,'font-weight':'bold',
    fill:'#1a4a6a','letter-spacing':'2'
  },'РАСПИСАНИЕ · ' + maxWeek + ' НЕДЕЛЬ'));

  canvas.appendChild(el('rect',{
    x:x1, y:tlY, width:w, height:50,
    fill:'#ffffff', stroke:'#d8c8a0','stroke-width':1, rx:8
  }));

  for(var i=0;i<maxWeek;i++){
    var x = x1 + i*ww;
    var wn = i+1;
    var ws = 'future';
    if(cur!==null){
      if(wn < cur) ws = 'past';
      else if(wn === cur) ws = 'current';
    }
    if(ws==='past'){
      canvas.appendChild(el('rect',{x:x,y:tlY+1,width:ww,height:48,fill:'rgba(138,128,112,0.15)'}));
    } else if(ws==='current'){
      canvas.appendChild(el('rect',{x:x,y:tlY+1,width:ww,height:48,fill:'rgba(26,92,58,0.2)'}));
    }
    if(i>0){
      canvas.appendChild(el('line',{x1:x,y1:tlY,x2:x,y2:tlY+50,stroke:'#e0d8c0','stroke-width':1}));
    }
    canvas.appendChild(el('text',{
      x:x+ww/2, y:tlY+20, 'text-anchor':'middle',
      'font-family':'Georgia, serif','font-size':(maxWeek>20?8:11),'font-weight':'bold',
      fill: ws==='current' ? '#1a5c3a' : '#8a8a78'
    }, String(wn)));

    if(maxWeek <= 16){
      var tops = [];
      Object.keys(SCHEDULE).forEach(function(id){
        if(SCHEDULE[id].weeks.indexOf(wn) !== -1){
          var t = NODES[id] ? NODES[id].sub : '';
          if(getStatus(id) === 'done') t = '✓ ' + t;
          tops.push(t);
        }
      });
      if(tops.length > 0){
        canvas.appendChild(el('text',{
          x:x+ww/2, y:tlY+38, 'text-anchor':'middle',
          'font-family':'Georgia, serif','font-size':8.5, fill:'#3a3a3a'
        }, tops[0].substring(0,18)));
        if(tops.length > 1){
          canvas.appendChild(el('text',{
            x:x+ww/2, y:tlY+46, 'text-anchor':'middle',
            'font-family':'Georgia, serif','font-size':8.5, fill:'#8a5a1a'
          }, tops[1].substring(0,18)));
        }
      }
    }
  }

  if(cur!==null && cur>=1 && cur<=maxWeek){
    var mx = x1 + (cur-0.5)*ww;
    canvas.appendChild(el('circle',{cx:mx,cy:tlY-10,r:6,fill:'#1a5c3a',stroke:'#ffffff','stroke-width':2}));
    canvas.appendChild(el('line',{x1:mx,y1:tlY-4,x2:mx,y2:tlY+50,stroke:'#1a5c3a','stroke-width':2,'stroke-dasharray':'4,3',opacity:0.6}));
    canvas.appendChild(el('text',{x:mx,y:tlY-18,'text-anchor':'middle','font-family':'Georgia, serif','font-size':10,'font-weight':'bold',fill:'#1a5c3a'},'СЕЙЧАС'));
  }
}

function openSource(url){

  try{
    var w=window.open(url,'_blank');
    if(!w){var a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();document.body.removeChild(a)}
  }catch(e){try{navigator.clipboard.writeText(url);showToast('Ссылка скопирована')}catch(err){prompt('Ссылка:',url)}}
}
function escJs(s){
  return String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r');
}
function isVideoSource(s){
  var t = (s.type||'').toLowerCase();
  var u = (s.url||'').toLowerCase();
  if(t.indexOf('видео') !== -1 || t.indexOf('video') !== -1) return true;
  if(u.indexOf('youtube') !== -1 || u.indexOf('youtu.be') !== -1) return true;
  if(u.indexOf('vimeo') !== -1) return true;
  if(u.indexOf('.mp4') !== -1 || u.indexOf('.webm') !== -1) return true;
  return false;
}

  var q=(author?author+' ':'')+name+' скачать pdf';
  openSource('https://yandex.ru/search/?text='+encodeURIComponent(q));
}

var sourcesBg=document.getElementById('sources-bg'),sourcesContent=document.getElementById('sources-content');
var currentSourcesLecture={sid:null,lid:null};
function openSources(sid,lid){
  var mats=getMats(sid),mat=null;
  for(var i=0;i<mats.length;i++)if(mats[i].id===lid){mat=mats[i];break}
  if(!mat||!mat.sources||!mat.sources.length)return;
  currentSourcesLecture = {sid:sid,lid:lid};
  var doneCount=0;
  for(var i=0;i<mat.sources.length;i++)if(isSourceDone(mat.sources[i].id))doneCount++;
  var total=mat.sources.length;
  var html='<button class="modal-close" onclick="closeSources()">×</button>';
  html+='<div class="modal-header"><div class="modal-tag">Первоисточники</div><h2>'+mat.title+'</h2><div class="meta">'+total+' произведений</div></div>';
  html+='<div class="sources-progress"><div class="lbl"><span>Прочитано</span><span class="num">'+doneCount+' / '+total+'</span></div><div class="bar"><div style="width:'+(total?(doneCount/total*100):0)+'%"></div></div></div>';
  html+='<div class="sources-list">';
  for(var i=0;i<mat.sources.length;i++){
    var s=mat.sources[i];var done=isSourceDone(s.id);
    var nm = escJs(s.name), au = escJs(s.author), uu = escJs(s.url);
    var isVid=isVideoSource(s);
    html+='<div class="source-item '+(done?'done':'')+'">';
    html+='<div class="source-check" onclick="toggleSource(\''+escJs(s.id)+'\',\''+escJs(sid)+'\',\''+escJs(lid)+'\')"></div>';
    html+='<div class="source-info"><div class="source-name">'+s.name+'</div>';
    if(s.author)html+='<div class="source-author">'+s.author+'</div>';
    if(s.type)html+='<div class="source-type">'+s.type+'</div>';
    html+='</div>';
    if(isVid){html+='<button class="source-watch" onclick="openSource(\''+uu+'\')">Смотреть</button>'}
    else{html+='<button class="source-download" onclick="downloadSource(\''+nm+'\',\''+au+'\')">Скачать</button>'}
    html+='</div>';
  }
  html+='</div>';
  html+='<div class="sources-footer"><button class="back-link" onclick="backToLectureFromSources()">← К лекции</button><span>«Скачать» — поиск PDF · «Смотреть» — видео</span></div>';
  sourcesContent.innerHTML=html;
  sourcesBg.classList.add('open');
}
function closeSources(){sourcesBg.classList.remove('open')}
function backToLectureFromSources(){
  if(!currentSourcesLecture.sid) return;
  closeSources();
  openMaterial(currentSourcesLecture.sid, currentSourcesLecture.lid);
}

var modalBg=document.getElementById('modal-bg'),modalContent=document.getElementById('modal-content');
function openMaterial(sid,mid){
  var mats=getMats(sid),mat=null;
  for(var i=0;i<mats.length;i++)if(mats[i].id===mid){mat=mats[i];break}
  if(!mat)return;
  var done=isMaterialDone(sid,mid);
  var html='<button class="modal-close" onclick="closeModal()">×</button>';
  html+='<div class="modal-header"><div class="modal-tag">'+mat.type+'</div><h2>'+mat.title+'</h2>';
  if(mat.source)html+='<div class="meta">Источник: '+mat.source+'</div>';
  if(mat.sources&&mat.sources.length)html+='<button class="btn-source" style="margin-top:14px" onclick="closeModal();openSources(\''+escJs(sid)+'\',\''+escJs(mid)+'\')">Список первоисточников →</button>';
  html+='</div>';
  html+='<div class="modal-body">';
  if(mat.sections){
    for(var j=0;j<mat.sections.length;j++){
      var s=mat.sections[j];
      if(s.h)html+='<h3>'+s.h+'</h3>';
      if(s.p)for(var k=0;k<s.p.length;k++)html+='<p>'+s.p[k]+'</p>';
      if(s.p2)for(var k=0;k<s.p2.length;k++)html+='<p>'+s.p2[k]+'</p>';
      if(s.list){html+='<ul>';for(var k=0;k<s.list.length;k++)html+='<li>'+s.list[k]+'</li>';html+='</ul>'}
      if(s.example)html+='<div class="example">'+s.example+'</div>';
    }
  }
  if(mat.keyIdea)html+='<div class="key-idea">'+mat.keyIdea+'</div>';
  if(mat.epistemic)html+=renderEpistemic(mat.epistemic);
  if(mat.forAdvanced)html+='<div class="for-advanced">'+mat.forAdvanced+'</div>';
  html+='</div>';
  html+='<div class="modal-footer">';
  if(mat.sources&&mat.sources.length)html+='<button class="btn-source" onclick="closeModal();openSources(\''+escJs(sid)+'\',\''+escJs(mid)+'\')">Первоисточники →</button>';
  else html+='<span></span>';
  html+='<div class="actions"><button class="btn-done '+(done?'done':'')+'" onclick="toggleMatModal(\''+escJs(sid)+'\',\''+escJs(mid)+'\')">'+(done?'✓ Изучено':'Отметить изученным')+'</button></div>';
  html+='</div>';
  modalContent.innerHTML=html;
  modalBg.classList.add('open');
}
function closeModal(){modalBg.classList.remove('open')}
function toggleMatModal(s,m){toggleMat(s,m);openMaterial(s,m)}

var toastEl=document.getElementById('toast'),toastTimer=null;
function showToast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){toastEl.classList.remove('show')},3500)}

function focusNode(id){
  var n = NODES[id];
  if(!n) return;
  var w = Math.max(700, n.r * 12);
  var h = w * 0.55;
  animateViewBox({
    x: n.x - w/2,
    y: n.y - h/2,
    w: w,
    h: h
  }, 220);
}
function resetView(){
  var target;
  if(activeCourse){
    var c = COURSES[activeCourse];
    target = {x:c.viewBox.x, y:c.viewBox.y, w:c.viewBox.w, h:c.viewBox.h};
  } else {
    target = {x:HOME_VIEWBOX.x, y:HOME_VIEWBOX.y, w:HOME_VIEWBOX.w, h:HOME_VIEWBOX.h};
  }
  animateViewBox(target, 250);
}
function toggleLabels(){labelsVisible=!labelsVisible;document.getElementById('labels-state').textContent=labelsVisible?'вкл':'выкл';render()}

canvas.addEventListener('wheel',function(e){e.preventDefault();var f=e.deltaY>0?1.1:0.9;var nw=vb.w*f,nh=vb.h*f;var cx=vb.x+vb.w/2,cy=vb.y+vb.h/2;vb.x=cx-nw/2;vb.y=cy-nh/2;vb.w=nw;vb.h=nh;render()},{passive:false});

var isDrag=false,ds={x:0,y:0},vs={x:0,y:0};
var pinchDist=0, pinchVb=null;

canvas.addEventListener('mousedown',function(e){isDrag=true;ds={x:e.clientX,y:e.clientY};vs={x:vb.x,y:vb.y}});
document.addEventListener('mousemove',function(e){if(!isDrag)return;var dx=e.clientX-ds.x,dy=e.clientY-ds.y;var sx=vb.w/window.innerWidth,sy=vb.h/window.innerHeight;vb.x=vs.x-dx*sx;vb.y=vs.y-dy*sy;render()});
document.addEventListener('mouseup',function(){isDrag=false});

canvas.addEventListener('touchstart',function(e){
  if(e.touches.length===1){
    isDrag=true;
    ds={x:e.touches[0].clientX,y:e.touches[0].clientY};
    vs={x:vb.x,y:vb.y};
    pinchDist=0;
    pinchVb=null;
  } else if(e.touches.length===2){
    isDrag=false;
    var t1=e.touches[0], t2=e.touches[1];
    pinchDist=Math.hypot(t1.clientX-t2.clientX, t1.clientY-t2.clientY);
    pinchVb={x:vb.x,y:vb.y,w:vb.w,h:vb.h};
  }
},{passive:true});

canvas.addEventListener('touchmove',function(e){
  if(e.touches.length===1 && isDrag){
    var dx=e.touches[0].clientX-ds.x,dy=e.touches[0].clientY-ds.y;
    var sx=vb.w/window.innerWidth,sy=vb.h/window.innerHeight;
    vb.x=vs.x-dx*sx;vb.y=vs.y-dy*sy;
    render();
  } else if(e.touches.length===2 && pinchVb){
    e.preventDefault();
    var t1=e.touches[0], t2=e.touches[1];
    var newDist=Math.hypot(t1.clientX-t2.clientX, t1.clientY-t2.clientY);
    var scale = pinchDist / Math.max(newDist, 1);
    var newW = pinchVb.w * scale;
    var newH = pinchVb.h * scale;
    if(newW < 300 || newW > 6000) return;
    var cx = pinchVb.x + pinchVb.w/2;
    var cy = pinchVb.y + pinchVb.h/2;
    vb.w = newW;
    vb.h = newH;
    vb.x = cx - newW/2;
    vb.y = cy - newH/2;
    render();
  }
},{passive:false});

canvas.addEventListener('touchend',function(e){
  if(e.touches.length < 2) pinchVb = null;
  if(e.touches.length === 0) isDrag = false;
});

document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeModal();closeSources();closeGlossary();closeTracks()}});

function checkMissingCourses(){
  var missing = [];
  if(!window.PAIDEIA_LECTURES) missing.push('Курс 1');
  if(!window.PAIDEIA_LECTURES_COURSE2) missing.push('Курс 2');
  if(!window.PAIDEIA_LECTURES_COURSE3) missing.push('Курс 3');
  if(!window.PAIDEIA_LECTURES_COURSE4) missing.push('Курс 4');
  if(!window.PAIDEIA_LECTURES_COURSE5) missing.push('Курс 5');
  if(!window.PAIDEIA_LECTURES_COURSE6) missing.push('Курс 6');
  if(!window.PAIDEIA_LECTURES_PHILOSOPHY) missing.push('Курс 7 · Философия');
  return missing;
}

if(initLectures()){
  document.getElementById('loading-screen').style.display='none';
  document.getElementById('screen-map').style.visibility='visible';

  var missingCourses = checkMissingCourses();
  if(missingCourses.length > 0){
    setTimeout(function(){
      showToast('Не загружены: ' + missingCourses.join(', ') + '. Проверьте файлы lectures*.js и philosophy*.js');
    }, 800);
  }
  if(window.__lecturesLoadErrors && window.__lecturesLoadErrors.length > 0){
    console.warn('Файлы, которые не удалось загрузить:', window.__lecturesLoadErrors);
  }

  var savedCourse = '';
  try{ savedCourse = localStorage.getItem('paideia-active-course') || ''; }catch(e){}
  if(savedCourse === 'course1' || savedCourse === 'course2' || savedCourse === 'course3' || savedCourse === 'course4' || savedCourse === 'course5' || savedCourse === 'course6' || savedCourse === 'course7'){
    enterCourse(savedCourse);
  } else {
    renderControls();
    render();
  }
} else {
  document.getElementById('load-status').textContent = 'Файлы лекций не найдены. Выберите файлы через кнопку выше или перетащите их в это окно.';
}
